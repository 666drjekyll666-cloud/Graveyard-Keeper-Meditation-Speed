name: Candidate Build

on:
  push:
    branches:
      - dev/0.1.2
    paths:
      - MeditationSpeed.csproj
      - src/**
      - .github/workflows/candidate-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MeditationSpeed.csproj

      - name: Build Release
        run: dotnet build MeditationSpeed.csproj -c Release --no-restore

      - name: Hash artifact
        run: sha256sum bin/Release/MeditationSpeed.dll | tee MeditationSpeed-0.1.2.sha256

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: MeditationSpeed-0.1.2
          path: |
            bin/Release/MeditationSpeed.dll
            MeditationSpeed-0.1.2.sha256
          if-no-files-found: error
