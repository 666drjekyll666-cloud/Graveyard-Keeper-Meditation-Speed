name: Publish accepted 1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.0.0.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact accepted artifact
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir accepted
          gh run download 35476504005 --repo "$GITHUB_REPOSITORY" --name MeditationSpeed-1.0.0 --dir accepted

      - name: Verify exact accepted DLL
        if: steps.release.outputs.exists != 'true'
        run: |
          DLL_PATH="$(find accepted -type f -name MeditationSpeed.dll -print -quit)"
          test -n "$DLL_PATH"
          echo "54888d085cefe957fc913e013b577da3890d31345956e62baeaf783c4af2bdfa  $DLL_PATH" | sha256sum --check -
          cp "$DLL_PATH" MeditationSpeed.dll

      - name: Write release notes
        if: steps.release.outputs.exists != 'true'
        run: |
          cat > release-notes.md <<'EOF'
          First official stable release of Meditation Speed for Graveyard Keeper 1.407.

          - Switch meditation between 1×, 2×, and 4×.
          - Keyboard and gamepad use Graveyard Keeper's native directional controls.
          - One physical press changes speed by exactly one step.
          - The meditation tip shows only directions that are currently available.
          - World time, recovery, crafting, crops, NPC schedules, and other native scaled-time systems continue through the game's own simulation path.
          - Wake/Back behavior stays vanilla.
          - Sleep speed, ordinary gameplay speed, and save data are unchanged.
          - Longer Days 1.7.1 was runtime-tested with a 675-second day.
          - Source code is available under the MIT License.

          Install: put `MeditationSpeed.dll` in `Graveyard Keeper/BepInEx/plugins/`.
          EOF

      - name: Publish exact accepted DLL
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 MeditationSpeed.dll \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Meditation Speed 1.0.0" \
            --notes-file release-notes.md \
            --latest

      - name: Mark 0.1.2 as pre-1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.1.2 --repo "$GITHUB_REPOSITORY" \
              --title "Meditation Speed 0.1.2 (pre-1.0)" \
              --prerelease
          fi
